<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Portal de Relatórios | Diretoria</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout">

    <!-- MENU LATERAL -->
    <aside class="sidebar">
        <h2>📊 Diretoria</h2>

        <button onclick="carregarRelatorio('faturamento')">
            Faturamento
        </button>

        <button onclick="carregarRelatorio('orcamento_2026')">
            Orçamento 2026
        </button>
    </aside>

    <!-- CONTEÚDO -->
<main class="content">

    <!-- TOPO DO CONTEÚDO (título + botão) -->
    <div class="top-bar">
        <h1 id="titulo">Relatório de Faturamento</h1>
        <button onclick="toggleFullscreen()">🔍 Tela cheia</button>
    </div>

    <!-- RELATÓRIO -->
    <iframe
        id="iframeRelatorio"
        src="https://app.powerbi.com/view?r=SEU_LINK"
        allowfullscreen>
    </iframe>

</main>

</div>

<script src="script.js"></script>
</body>
</html>
